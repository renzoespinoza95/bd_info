<div class="col prod-col" data-cats="{{cats}}">
  <article class="prod" data-id="{{id}}" tabindex="0">
    <span class="tape"></span>
    <div class="prod-img"><img loading="lazy" src="{{img}}" alt="{{name}}"></div>
    <div class="prod-info">
      <small class="marca">{{marca}}</small>
      <h3>{{name}}</h3>
      <div class="prod-bot">
        <b class="price">S/ {{precio_fmt}}</b>
        <button type="button" class="btn-add" data-add="{{id}}" aria-label="Agregar al carrito"><i class="bi bi-bag-plus"></i></button>
      </div>
    </div>
  </article>
</div>
