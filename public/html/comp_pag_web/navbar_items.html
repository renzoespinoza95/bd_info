<header class="gc-nav sticky-top">
  <nav class="navbar navbar-expand-lg px-3 px-lg-5">
    <a class="navbar-brand gc-brand" href="#inicio">
      <img src="{{img_logo}}" alt="" width="34" height="34"><span class="display">{{nombre_negocio}}*</span>
    </a>
    <div class="d-flex align-items-center gap-2 order-lg-3">
      <button class="gc-cart-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasCarrito" aria-label="Carrito">
        <i class="bi bi-bag"></i> <span class="d-none d-sm-inline">CARRITO</span> (<span id="cart-count">0</span>)
      </button>
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasMenu" aria-label="Menú">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <div class="offcanvas offcanvas-end offcanvas-lg" tabindex="-1" id="offcanvasMenu">
      <div class="offcanvas-header">
        <h5 class="display m-0">{{nombre_negocio}}*</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
      </div>
      <div class="offcanvas-body justify-content-center">
        <ul class="navbar-nav gap-lg-4">
          {{#links}}
          <li class="nav-item"><a class="nav-link gc-link" href="{{href}}">{{label}}</a></li>
          {{/links}}
        </ul>
      </div>
    </div>
  </nav>
</header>
