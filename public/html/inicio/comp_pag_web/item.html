<div class="swipe-card" style="position: absolute; width: 100%; height: 100%;">
    <img src="{{thumb}}" alt="{{titulo}}" data-card-title="{{titulo}}" style="width: 100%; height: 80%; object-fit: cover;" draggable="false">
    <div class="swipe-card-body d-flex flex-column justify-content-between py-2 bg-white" style="height: 20%;">
        <div class="w-100 text-truncate">
            <span class="fw-bold text-dark fs-6">{{titulo}}</span>
        </div>
        <a href="https://wa.me/51988689682?text=Hola,%20quiero%20información%20para%20una%20página%20web" target="_blank" class="btn-whatsapp py-1 px-2 text-decoration-none text-white rounded-pill text-center" style="background-color: #25D366;" onclick="event.stopPropagation();">
            <i class="bi bi-whatsapp fs-6"></i>
            <span class="fs-7">Pedir ahora</span>
        </a>
    </div>
</div>
