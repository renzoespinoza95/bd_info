<header class="py-3 px-4 d-flex justify-content-between align-items-center header-bar shadow-sm">
    <div class="d-flex align-items-center gap-2">
        <div class="brand-badge me-2" style="background: transparent; width: auto; height: auto;">
            <img src="{{header.logo}}" alt="Favicon Logo" style="width: 28px; height: 28px; object-fit: contain;">
        </div>
        <h1 class="h4 mb-0 fw-bold text-white">Bienvenido</h1>
    </div>
    <button class="btn btn-outline-light rounded-pill btn-sm px-3" data-bs-toggle="offcanvas" data-bs-target="#menuDrawer">
        <i class="bi bi-list me-1"></i> Menú
    </button>
</header>

<div class="offcanvas offcanvas-end custom-drawer" tabindex="-1" id="menuDrawer" aria-labelledby="menuDrawerLabel">
    <div class="offcanvas-header border-bottom border-light-subtle">
        <h5 class="offcanvas-title text-white fw-bold" id="menuDrawerLabel">
            <i class="bi bi-compass me-2"></i>Navegación
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
    </div>
    <div class="offcanvas-body">
        <ul class="list-group list-group-flush drawer-menu">
            <li class="list-group-item bg-transparent text-white border-0 py-3 cursor-pointer" data-bs-toggle="modal" data-bs-target="#modalNosotros" data-bs-dismiss="offcanvas">
                <i class="bi bi-people-fill me-3 fs-5"></i>Nosotros
            </li>
            <li class="list-group-item bg-transparent text-white border-0 py-3 cursor-pointer" data-bs-toggle="modal" data-bs-target="#modalClientes" data-bs-dismiss="offcanvas">
                <i class="bi bi-briefcase-fill me-3 fs-5"></i>Clientes
            </li>
        </ul>
    </div>
</div>
