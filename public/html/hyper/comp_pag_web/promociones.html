<div class="promociones-section" style="width:100%; max-width:1120px; margin:30px auto 40px; padding:0 var(--edge);">
  
  <div style="border-bottom: 3px solid var(--lime); padding-bottom: 10px; margin-bottom: 24px;" data-reveal>
    <span class="kicker hl-orange">{{{subtitulo_promocion}}}</span>
    <h2 class="big hl-lime" style="margin-top:4px;">{{{titulo_promocion}}}</h2>
  </div>

  <div class="promociones-grid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px;">
    {{#promociones}}
    <div class="promo-card-wrapper select-subcat-card" data-reveal style="position: relative; border: 3px solid var(--ink); background: var(--ink-2); box-shadow: 5px 5px 0 var(--lime); overflow: hidden; aspect-ratio: 4/3; cursor: pointer;" onclick="this.classList.toggle('active-touch')">
      
      <script type="application/json" class="subcat-json-script">{{{subcat_items_json_encoded}}}</script>

      <img src="{{img}}" alt="{{titulo}}" style="width: 100%; height: 100%; object-fit: cover; display: block;" loading="lazy">
      
      <div style="position: absolute; top: 0; left: 0; right: 0; background: var(--orange); color: var(--ink); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid var(--ink); z-index: 2;">
        <span style="font-family: var(--font-display); font-size: 19px; letter-spacing: 1px; text-transform: uppercase;">{{titulo}}</span>
        <span style="font-family: var(--font-pixel); font-size: 24px; color: var(--ink); line-height: 1;">+</span>
      </div>

      <div class="promo-overlay" style="position: absolute; inset: 0; background: rgba(11, 11, 25, 0.94); backdrop-filter: blur(4px); display: flex; flex-direction: column; justify-content: space-between; padding: 22px; opacity: 0; transition: opacity 0.3s ease; z-index: 5;">
        <div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
            <span style="font-family: var(--font-display); font-size: 22px; color: var(--lime); letter-spacing: 1px; text-transform: uppercase;">{{titulo}}</span>
            <span style="font-family: var(--font-pixel); font-size: 28px; color: var(--orange); line-height: 1;">+</span>
          </div>
          <div style="width: 100%; height: 2px; background: rgba(208, 245, 58, 0.4); margin-bottom: 12px;"></div>
          
          <div class="card-html-desc" style="font-family: var(--font-body); font-size: 15px; color: var(--white); line-height: 1.5;">
            {{{html_contenido}}}
          </div>
        </div>

        <div style="display: flex; justify-content: center; margin-top: 10px;">
          <a href="#" data-goto="{{slide_target}}" class="btn fill btn-explorar-promo" style="background: var(--lime); color: var(--ink); border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--orange); font-family: var(--font-pixel); letter-spacing: 1px; padding: 9px 20px; font-size: 16px; display: inline-flex; align-items: center; gap: 10px; width: 100%; justify-content: center;">
            EXPLORAR <span style="font-size: 18px;">&rarr;</span>
          </a>
        </div>
      </div>

    </div>
    {{/promociones}}
  </div>
</div>

<style>
  .promo-card-wrapper:hover .promo-overlay,
  .promo-card-wrapper.active-touch .promo-overlay {
    opacity: 1 !important;
  }
</style>
