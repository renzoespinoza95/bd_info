<div class="promociones-section" style="width:100%; max-width:1120px; margin:20px auto 50px; padding:0 var(--edge); position:relative; z-index:2;">
  
  <div style="border-bottom: 3px solid var(--lime); padding-bottom: 10px; margin-bottom: 24px;" data-reveal>
    <span class="kicker hl-orange">{{{subtitulo_promocion}}}</span>
    <h2 class="big hl-lime" style="margin-top:4px;">{{{titulo_promocion}}}</h2>
  </div>

  <!-- Todos los diseños de todas las subcategorías, en 2 columnas -->
  <div class="design-grid" data-reveal>
    {{#promociones}}
      {{#subcat_items}}
      <figure class="design-card" data-title="{{titulo}}" data-img="{{img}}" tabindex="0" role="button" aria-label="Ver {{titulo}}">
        <img src="{{img}}" alt="{{titulo}}" loading="lazy">
        <figcaption class="design-cap">{{titulo}}</figcaption>
      </figure>
      {{/subcat_items}}
    {{/promociones}}
  </div>

</div>
