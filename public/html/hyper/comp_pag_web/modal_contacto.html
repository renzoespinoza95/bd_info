<!-- Modal de diseños a pantalla completa (se usa desde el inicio y desde "Mis trabajos") -->
<div id="imageModal" role="dialog" aria-modal="true" data-noswipe data-wa-url="{{url_whatsapp}}" aria-hidden="true" style="display:none; position:fixed; inset:0; z-index:99999; background:#0B0B0B;">

  <div id="designScroller" class="design-scroller scrollable" tabindex="-1">
    <div style="max-width:900px; margin:0 auto;">
      <img id="designModalImg" alt="" style="display:block; width:100%; height:auto;">
    </div>
  </div>

  <button id="designPrev" class="design-arrow" type="button" aria-label="Anterior" style="left:12px;">&larr;</button>
  <button id="designNext" class="design-arrow" type="button" aria-label="Siguiente" style="right:12px;">&rarr;</button>

  <button id="closeImageModal" type="button" aria-label="Cerrar" style="position:absolute; top:14px; right:14px; z-index:6; background:var(--orange); color:var(--ink); border:3px solid var(--ink); font-family:var(--font-pixel); font-size:20px; letter-spacing:1px; padding:6px 14px; cursor:pointer; box-shadow:4px 4px 0 var(--lime);">
    CERRAR &#10005;
  </button>

  <div style="position:absolute; left:0; right:0; bottom:22px; display:flex; justify-content:center; pointer-events:none; z-index:6;">
    <a id="designWant" class="menu-btn" href="#" target="_blank" rel="noopener noreferrer" style="pointer-events:auto; display:inline-block; background:var(--lime); color:var(--ink); border:3px solid var(--ink); box-shadow:4px 4px 0 var(--ink); font-family:var(--font-pixel); font-size:18px; padding:8px 16px;">
      Lo quiero!
    </a>
  </div>
</div>

<style>
  /* Con el modal abierto se ocultan la barra superior, el progreso y el footer */
  body.modal-open .topbar,
  body.modal-open .progress,
  body.modal-open .footerbar {
    display: none !important;
  }

  /* Cuadrícula de miniaturas: 2 columnas, cada miniatura con su alto completo */
  .design-grid {
    display: block;
    column-count: 2;
    column-gap: 16px;
    margin-top: 14px;
  }
  .design-card {
    position: relative;
    display: block;
    margin: 0 0 16px;
    overflow: hidden;
    border: 3px solid var(--ink);
    background: var(--ink-2);
    box-shadow: 4px 4px 0 var(--ink);
    cursor: pointer;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    transition: box-shadow .18s var(--pop);
  }
  /* Sin desplazamiento en hover: así el área de clic no se mueve bajo el cursor */
  .design-card:hover {
    box-shadow: 7px 7px 0 var(--ink);
  }
  .design-card img {
    display: block;
    width: 100%;
    height: auto;          /* alto completo de la imagen, en miniatura */
    max-width: 100%;
  }
  .design-card .design-cap {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(11, 11, 25, 0.85);
    color: #fff;
    padding: 8px 12px;
    font-family: var(--font-display);
    font-size: 15px;
    text-transform: uppercase;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* En slides oscuros (inicio) el borde y la sombra deben verse */
  .s-ink .design-card {
    border-color: var(--lime);
    box-shadow: 4px 4px 0 var(--orange);
  }
  .s-ink .design-card:hover {
    box-shadow: 7px 7px 0 var(--orange);
  }

  /* Área con scroll vertical dentro del modal */
  .design-scroller {
    position: absolute;
    inset: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 0 64px 96px;
    overscroll-behavior: contain;
    -webkit-overflow-scrolling: touch;
    outline: none;
  }
  .design-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    z-index: 5;
    width: 45px;
    height: 45px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--lime);
    color: var(--ink);
    border: 3px solid var(--ink);
    box-shadow: 3px 3px 0 var(--orange);
    font-family: var(--font-pixel);
    font-size: 22px;
    cursor: pointer;
  }

  @media (max-width: 640px) {
    .design-grid { column-gap: 10px; }
    .design-card { margin-bottom: 10px; }
    .design-scroller { padding: 0 0 96px; }
    .design-arrow { width: 38px; height: 38px; opacity: .92; }
  }
</style>
