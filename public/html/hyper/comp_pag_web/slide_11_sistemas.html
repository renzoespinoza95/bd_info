<style>
  /* Miniaturas de sistemas: 2 columnas, alto completo de cada imagen */
  .sistemas-grid {
    display: block;
    column-count: 2;
    column-gap: 16px;
    margin-top: 14px;
  }
  .sistema-card {
    position: relative;
    display: block;
    margin: 0 0 16px;
    overflow: hidden;
    border: 3px solid var(--lime);
    background: var(--ink-2);
    box-shadow: 4px 4px 0 var(--orange);
    cursor: pointer;
    break-inside: avoid;
    -webkit-column-break-inside: avoid;
    page-break-inside: avoid;
    transition: box-shadow .18s var(--pop);
  }
  .sistema-card:hover { box-shadow: 7px 7px 0 var(--orange); }
  .sistema-card img { display: block; width: 100%; height: auto; }
  .sistema-card .sis-cap {
    position: absolute; left: 0; right: 0; bottom: 0;
    background: rgba(11, 11, 25, 0.85); color: #fff;
    padding: 8px 12px; font-family: var(--font-display); font-size: 15px;
    text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sistema-card .sis-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--lime); color: var(--ink); border: 3px solid var(--ink);
    display: grid; place-items: center; font-size: 22px; padding-left: 4px;
    pointer-events: none;
  }
  @media (max-width: 640px) {
    .sistemas-grid { column-gap: 10px; }
    .sistema-card { margin-bottom: 10px; }
    .sistema-card .sis-play { width: 46px; height: 46px; font-size: 18px; }
  }

  /* ===== Modal de video vertical (9:16) a pantalla completa ===== */
  #videoModal {
    display: none;
    position: fixed; inset: 0; z-index: 99999;
    background: #0B0B0B;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 8px;
    padding: 56px 8px 10px;
  }
  #videoModal .vm-title {
    font-family: var(--font-display); color: var(--lime); text-transform: uppercase;
    font-size: clamp(15px, 2.2vw, 22px); text-align: center; line-height: 1.1;
    max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  /* Marco 9:16: se ajusta al alto disponible y nunca se sale del ancho */
  #videoModal .vm-frame {
    /* respaldo para navegadores sin dvh */
    width: min(calc(100vw - 16px), calc((100vh - 110px) * 9 / 16));
    /* alto dinámico real (descuenta la barra del navegador móvil) */
    width: min(calc(100vw - 16px), calc((100dvh - 110px) * 9 / 16));
    aspect-ratio: 9 / 16;
    background: #000;
    border: 3px solid var(--lime);
  }
  #videoModal iframe,
  #videoModal .vm-img { width: 100%; height: 100%; border: 0; display: none; }
  #videoModal .vm-img { object-fit: contain; }
</style>

<section class="slide s-ink" data-slide="10">
  <div class="inner scrollable">
    <div class="wrap" style="width:100%; max-width:1120px; margin:20px auto 50px; position:relative; z-index:2;">

      <div style="border-bottom: 3px solid var(--lime); padding-bottom: 10px; margin-bottom: 24px;" data-reveal>
        <span class="kicker hl-orange">Sistemas para negocios</span>
        <h2 class="big hl-lime" style="margin-top:4px;">NUEVOS SISTEMAS</h2>
      </div>

      <div class="sistemas-grid" data-reveal>
        {{#sistemas}}
        <figure class="sistema-card" data-title="{{titulo}}" data-img="{{img}}" data-video="{{video_src}}" tabindex="0" role="button" aria-label="Ver video de {{titulo}}">
          <img src="{{img}}" alt="{{titulo}}" loading="lazy">
          {{#tiene_video}}<span class="sis-play">&#9654;</span>{{/tiene_video}}
          <figcaption class="sis-cap">{{titulo}}</figcaption>
        </figure>
        {{/sistemas}}
      </div>

      {{^sistemas}}
      <p class="mono" data-reveal style="color:var(--white);">Próximamente nuevos sistemas.</p>
      {{/sistemas}}

    </div>
  </div>
</section>

<!-- Modal de video a pantalla completa (se mueve al <body> por script) -->
<div id="videoModal" role="dialog" aria-modal="true" aria-hidden="true">
  <button id="closeVideoModal" type="button" aria-label="Cerrar" style="position:absolute; top:12px; right:12px; z-index:6; background:var(--orange); color:var(--ink); border:3px solid var(--ink); font-family:var(--font-pixel); font-size:20px; letter-spacing:1px; padding:6px 14px; cursor:pointer; box-shadow:4px 4px 0 var(--lime);">
    CERRAR &#10005;
  </button>
  <div id="videoModalTitle" class="vm-title"></div>
  <div class="vm-frame">
    <iframe id="videoModalFrame" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    <img id="videoModalImg" class="vm-img" alt="">
  </div>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const modal = document.getElementById("videoModal");
    if (!modal) return;
    document.body.appendChild(modal); // fuera del deck para que quede por encima de todo

    const frame = document.getElementById("videoModalFrame");
    const img = document.getElementById("videoModalImg");
    const title = document.getElementById("videoModalTitle");
    const btnClose = document.getElementById("closeVideoModal");

    function isOpen() { return modal.style.display === "flex"; }

    function openVideo(card) {
      const src = card.getAttribute("data-video") || "";
      title.textContent = card.getAttribute("data-title") || "";
      if (src) {
        img.style.display = "none";
        img.removeAttribute("src");
        frame.style.display = "block";
        frame.src = src;
      } else {
        // Item sin video: se muestra su imagen
        frame.style.display = "none";
        frame.removeAttribute("src");
        img.src = card.getAttribute("data-img") || "";
        img.style.display = "block";
      }
      modal.style.display = "flex";
      modal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
    }

    function closeVideo() {
      modal.style.display = "none";
      modal.setAttribute("aria-hidden", "true");
      document.body.classList.remove("modal-open");
      frame.removeAttribute("src"); // detiene el video
      img.removeAttribute("src");
    }

    document.querySelectorAll(".sistema-card").forEach((card) => {
      card.addEventListener("click", (e) => {
        e.preventDefault();
        if (!isOpen()) openVideo(card);
      });
    });

    if (btnClose) btnClose.addEventListener("click", closeVideo);

    // Fase de captura: evita que el teclado cambie de slide con el modal abierto
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") {
        const card = e.target.closest && e.target.closest(".sistema-card");
        if (card && !isOpen()) { e.preventDefault(); openVideo(card); return; }
      }
      if (!isOpen()) return;
      if (e.key === "Escape") { e.preventDefault(); closeVideo(); }
      e.stopImmediatePropagation();
    }, true);
  });
</script>
