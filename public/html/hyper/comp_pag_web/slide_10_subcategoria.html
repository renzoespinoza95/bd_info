<section class="slide s-orange" data-slide="9">
    <div class="inner scrollable">
      <div class="wrap">
        <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:14px;flex-wrap:wrap" data-reveal>
          <div>
            <span class="kicker">MIS TRABAJOS</span>
            <h2 class="big" style="margin-top:6px">TODOS LOS DISEÑOS</h2>
          </div>
          <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
            <a class="btn" href="{{url_whatsapp}}" target="_blank" rel="noopener noreferrer">Solicitar información</a>
          </div>
        </div>

        <!-- Todos los diseños de todas las subcategorías, en 2 columnas -->
        <div class="design-grid" data-reveal>
          {{#promociones}}
            {{#subcat_items}}
            <figure class="design-card" data-title="{{titulo}}" data-img="{{img}}" tabindex="0" role="button" aria-label="Ver {{titulo}}">
              <img src="{{img}}" alt="{{titulo}}" loading="lazy">
              <figcaption class="design-cap">{{titulo}}</figcaption>
            </figure>
            {{/subcat_items}}
          {{/promociones}}
        </div>
      </div>
    </div>
  </section>
